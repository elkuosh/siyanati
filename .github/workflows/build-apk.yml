name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source bundle
        run: |
          if [ -f bundle.b64 ]; then
            base64 -d bundle.b64 | tar -xJ
            git rm -q bundle.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack app source"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Icons
        run: |
          pip install pillow
          python3 tool/make_icons.py

      - name: Create Android project
        run: flutter create --org com.rovana --project-name garage_log --platforms android .

      - name: Patch Android project
        run: dart run tool/setup.dart

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk siyanati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: siyanati-apk
          path: siyanati.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Siyanati 1.0.${{ github.run_number }}
          files: siyanati.apk
          make_latest: true
